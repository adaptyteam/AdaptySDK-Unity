name: JSON layer tests

# Golden tests for the SDK JSON layer. They link the SDK sources into a plain .NET project,
# so they need neither the Unity Editor nor a Unity licence and run on every push.
#
# The SDK branches on UNITY_IOS / UNITY_ANDROID inside the JSON layer, so the same suite runs
# once per platform against its own set of approved snapshots.

on:
  push:
    branches: ["**"]
    paths:
      - "Packages/com.adapty.unity-sdk/Runtime/**"
      - "tests/**"
      - ".github/workflows/json-layer-tests.yml"
  pull_request:
    paths:
      - "Packages/com.adapty.unity-sdk/Runtime/**"
      - "tests/**"
      - ".github/workflows/json-layer-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ["", "UNITY_IOS", "UNITY_ANDROID"]
    name: ${{ matrix.platform == '' && 'editor' || matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/AdaptySDK.GoldenTests/AdaptySDK.GoldenTests.csproj

      - name: Test
        run: |
          if [ -z "${{ matrix.platform }}" ]; then
            dotnet test tests/AdaptySDK.GoldenTests/AdaptySDK.GoldenTests.csproj --no-restore
          else
            dotnet test tests/AdaptySDK.GoldenTests/AdaptySDK.GoldenTests.csproj --no-restore \
              -p:AdaptyPlatform=${{ matrix.platform }}
          fi

      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-snapshots-${{ matrix.platform == '' && 'editor' || matrix.platform }}
          path: tests/AdaptySDK.GoldenTests/Fixtures/approved/*.received.txt
          if-no-files-found: ignore
